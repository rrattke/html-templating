<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solid Signals Example</title>
    <style>
      :root {
        font-family: 'Space Grotesk', 'Sora', system-ui, sans-serif;
        background: linear-gradient(180deg, #fdfdfd 0%, #eef6ff 55%, #e0f2fe 100%);
        color: #0f172a;
        min-height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
        box-sizing: border-box;
      }
      .demo-shell {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 2rem;
        max-width: 800px;
        margin: 0 auto;
      }
      .demo-shell > * {
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <demo-counter></demo-counter>
      <demo-list></demo-list>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
