<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Rendering Example</title>
    <style>
      :root {
        font-family: 'Space Grotesk', 'Sora', system-ui, sans-serif;
        background: linear-gradient(180deg, #fefefe 0%, #f3f4f6 60%, #e5f3e0 100%);
        color: #0f172a;
        min-height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .container {
        max-width: 600px;
        background: white;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-top: 0;
        color: #166534;
      }
      .description {
        color: #64748b;
        margin-bottom: 1.5rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 0.75rem 1rem;
        background: #f0fdf4;
        border-radius: 8px;
        margin-bottom: 0.5rem;
        border-left: 3px solid #22c55e;
      }
      .nested-section {
        margin-top: 2rem;
        padding: 1rem;
        background: #f8fafc;
        border-radius: 8px;
      }
      .nested-section h2 {
        margin-top: 0;
        font-size: 1.1rem;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
