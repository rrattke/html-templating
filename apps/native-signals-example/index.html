<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanishing Framework Demo</title>
    <style>
      :root {
        font-family: 'Space Grotesk', 'Sora', system-ui, sans-serif;
        background: linear-gradient(180deg, #fefefe 0%, #f3f4f6 60%, #e0e7ff 100%);
        color: #0f172a;
        min-height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
        box-sizing: border-box;
      }
      .demo-shell {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 2rem;
        max-width: 1400px;
        margin: 0 auto;
      }
      .demo-shell > * {
        min-width: 0;
      }
      data-table {
        grid-column: 1 / -1;
      }
      @media (min-width: 1200px) {
        .demo-shell {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <demo-counter></demo-counter>
      <demo-list></demo-list>
      <todo-list></todo-list>
      <data-table></data-table>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
